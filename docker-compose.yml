version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: local_ai_postgres
    restart: always
    environment:
      POSTGRES_USER: ai_runner_user
      POSTGRES_PASSWORD: ai_runner_password
      POSTGRES_DB: local_ai_runner_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
